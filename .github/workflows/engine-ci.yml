name: engine-ci

on:
  push:
    branches: [main, stage5, macos-port]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: engine

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # (CI-C1, the owner's 2026-11-11 Agent C GO — the workflow-only
      # build-cache checkpoint) Rust dependency/build cache, placed
      # AFTER the pinned toolchain install because rust-cache derives
      # its cache key from the active rustc/cargo pair. Pinned to the
      # immutable v2.9.3 commit (annotated GPG-signed tag, published
      # 2026-10-20; node24 runtime). "engine -> target" follows the
      # action's documented semantics — the target part is relative
      # to the workspace part — matching this workflow's engine/
      # working directory. Every other input stays at its default:
      # ONLY dependency crates are cached (cache-workspace-crates is
      # false, so workspace crates — including the engine-persist
      # rlib the activation-isolation gate below inspects — are
      # rebuilt from source by the current run's Build step, never
      # restored from a cache); caches save from green jobs only.
      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "engine -> target"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      # R16 (the K2-C1 final-review activation-isolation check): the
      # feature-disabled build — the plain `cargo build --workspace`
      # above, the shipping configuration with NO --features flag —
      # must not compile the test-only activation helper into
      # engine-persist at all. A production artifact therefore cannot
      # call it: the symbol is absent from the rlib the Build step
      # just produced (this step runs BEFORE the feature-enabled
      # Tests step refreshes the target directory).
      - name: Activation isolation (Linux only — the feature-disabled build carries no activation symbol)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rlib="target/debug/libengine_persist.rlib"
          [ -f "$rlib" ] || { echo "missing $rlib (the Build step artifact)"; exit 1; }
          count=$(nm "$rlib" | grep -c test_enable_composite_publication || true)
          if [ "$count" != "0" ]; then
            echo "the feature-disabled build carries the activation symbol ($count matches)"
            exit 1
          fi
          # (T2, the final-matrix review) The adversarial completion-
          # marker publisher must be equally absent from the shipping
          # artifact — the compile-time feature isolation made
          # enforceable.
          adversarial=$(nm "$rlib" | grep -c test_only_install_completion_marker || true)
          if [ "$adversarial" != "0" ]; then
            echo "the feature-disabled build carries the adversarial marker publisher ($adversarial matches)"
            exit 1
          fi
          # (V2X-CP3-A1-3, superseded at CP3-B P1) The A1-3
          # read-only verifier (verify_installed_ancestry_witness)
          # is the specifically authorized production surface: its
          # PRESENCE in the feature-disabled rlib is asserted. (The
          # publisher's former absence assertion is superseded by
          # the B-P1 PRESENCE assertion below — the owner's
          # nondestructive activation GO.)
          readonly_surface=$(nm "$rlib" | grep -c verify_installed_ancestry_witness || true)
          if [ "$readonly_surface" == "0" ]; then
            echo "the feature-disabled build is missing the authorized read-only witness verifier"
            exit 1
          fi
          # (V2X-CP3-A2/A3 + CP3-B P1) The authenticated historical
          # walker and the exact preservation accounting are the
          # authorized read-only A2/A3 production surfaces, and the
          # ancestry-witness PUBLISHER is now the authorized
          # nondestructive B-P1 production surface (the accepted A1-2
          # publication contract, ungated from its test-only feature
          # isolation): their PRESENCE in the feature-disabled rlib
          # is asserted alongside the A1-3 verifier. The TEST-ONLY
          # surfaces remain compile-time excluded: the composite
          # activation helper, the adversarial completion-marker
          # installer, and every destructive V2 execution symbol.
          walker_surface=$(nm "$rlib" | grep -c walk_authenticated_history || true)
          if [ "$walker_surface" == "0" ]; then
            echo "the feature-disabled build is missing the authorized read-only A2 historical walker"
            exit 1
          fi
          a3_surface=$(nm "$rlib" | grep -c account_batch_retirement || true)
          if [ "$a3_surface" == "0" ]; then
            echo "the feature-disabled build is missing the authorized read-only A3 preservation accounting"
            exit 1
          fi
          publisher_surface=$(nm "$rlib" | grep -c publish_ancestry_witness || true)
          if [ "$publisher_surface" == "0" ]; then
            echo "the feature-disabled build is missing the authorized nondestructive B-P1 witness publisher"
            exit 1
          fi
          # (T2-B) The crossing's crash-test seams are compile-time
          # excluded from the production build — the process-exit
          # arm must be absent from the feature-disabled engine-slice
          # artifact.
          slice_rlib="target/debug/libengine_slice.rlib"
          if [ -f "$slice_rlib" ]; then
            arms=$(nm "$slice_rlib" | grep -c ARM_RECLAIM_BEFORE_COMPLETION || true)
            if [ "$arms" != "0" ]; then
              echo "the feature-disabled build carries the crash-test arm ($arms matches)"
              exit 1
            fi
            echo "crash-seam isolation verified: 0 ARM_RECLAIM_BEFORE_COMPLETION symbols in the feature-disabled engine-slice rlib"
          fi
          echo "activation isolation verified: 0 activation symbols in the feature-disabled rlib"
      # (CI-C2, the owner's 2026-11-11 GO — the F1-corrected package
      # sharding) The workspace feature battery is split by package:
      # this job runs every package EXCEPT engine-slice; the parallel
      # heavy-tests job runs the COMPLETE engine-slice battery. The
      # command is the F1-verified form — composite-test-fixture
      # explicitly for engine-persist (which also selects its two
      # required-features integration binaries composite_append and
      # composite_reader), engine-slice excluded here and carrying
      # crash-test-seams only in its own job, where its
      # dev-dependency edge enables engine-persist/composite-test-
      # fixture (cargo tree -f '{p} {f}' verified both sides). The
      # partition is exact at the CYCLE-3 CONSOLIDATED tree (the
      # cycle-2 main 2ea7622, plus Agent A's C5d discovered-range-
      # observation AND Agent B's B-R1a4 witness-degradation matrix,
      # both from that baseline; recomputed from executed runs —
      # never estimates): this shard executes 950 tests on Linux /
      # 899 on Windows (the cycle-3 consolidated 947 / 896 plus the
      # F-01 audit-hardening package's 3 FULLY CROSS-PLATFORM
      # engine-persist lib tests — the malformed-epoch regression +
      # the two try_regular tests, no cfg gates; the Linux count
      # MEASURED at this exact shard command on the audit worktree:
      # 950 passed / 1 ignored / 30 result lines, rc=0; the Windows
      # count the exact uniform delta 896 + 3); heavy supplies 448 /
      # 447 (UNCHANGED — engine-slice gained no tests, only the
      # benchmark mode; re-MEASURED at this tree); the two shards
      # sum to the F-01 battery (1398 / 1346).
      # MAINTENANCE OBLIGATION (the F2 exact-count gates): adding
      # legitimate tests to any package requires updating the pinned
      # counts in this step and the heavy job's step in the same
      # change — a deliberate reviewed touchpoint, never a silent
      # pass-through. The main job's later simulation, Vulkan, and
      # integrated-soak commands are separate acceptance checks, not
      # duplicated test suites, and remain mandatory.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude engine-slice --features engine-persist/composite-test-fixture 2>&1 | tee tests-main.log
          expected=950
          if [ "$(uname -s)" != "Linux" ]; then expected=899; fi
          passed=$(awk '/test result: ok/ {for(i=1;i<NF;i++) if($(i+1)=="passed;") s+=$i} END {print s+0}' tests-main.log)
          ignored=$(awk '/test result: ok/ {for(i=1;i<NF;i++) if($(i+1)=="ignored;") s+=$i} END {print s+0}' tests-main.log)
          results=$(grep -c 'test result:' tests-main.log || true)
          echo "main shard: $passed passed, $ignored ignored, $results test-result lines (expected $expected / 1 / 30)"
          [ "$passed" -eq "$expected" ] || { echo "MAIN SHARD COUNT MISMATCH: $passed != $expected"; exit 1; }
          [ "$ignored" -eq 1 ] || { echo "MAIN SHARD IGNORED MISMATCH: $ignored != 1"; exit 1; }
          [ "$results" -eq 30 ] || { echo "MAIN SHARD RESULT-LINE MISMATCH: $results != 30"; exit 1; }
      # (V2X-CP3-B-P1 F3, extended to B-R1a2) The FEATURE-DISABLED
      # production-path regression: the B-P1 and B-R1a2 production
      # tests are cfg(test)-only (never feature-gated), and this
      # step runs them WITHOUT the composite-test-fixture flag on
      # every platform — the proof that the production publishers
      # and the classifier observation paths work in the normal
      # build. The commands must fail if any production-path test
      # fails or if a module is silently absent (the exact-name
      # filter reports zero-run as an error).
      - name: Feature-disabled production-path tests (B-P1, B-R1a2)
        run: |
          cargo test -p engine-persist --lib bp1_production_tests
          cargo test -p engine-persist --lib r1a2_production_tests
      - name: Fingerprint self-test double run
        shell: bash
        run: |
          a=$(cargo run -q -p engine-slice -- --fingerprint-selftest)
          b=$(cargo run -q -p engine-slice -- --fingerprint-selftest)
          if [ "$a" != "$b" ]; then
            echo "fingerprint self-test mismatch between runs"
            exit 1
          fi
          echo "$a"
          # Stage 0 historical baseline compatibility: the pinned values.
          echo "$a" | grep -q "engine=6504123a47cab66f" || { echo "Stage 0 engine fingerprint changed"; exit 1; }
          echo "$a" | grep -q "state=937bd3b6f56f07e0" || { echo "Stage 0 state fingerprint changed"; exit 1; }
      - name: Stage 5 spine-save self-test (double run, pinned canonical bytes)
        shell: bash
        run: |
          a=$(cargo run -q -p engine-slice -- --save-selftest)
          b=$(cargo run -q -p engine-slice -- --save-selftest)
          if [ "$a" != "$b" ]; then
            echo "spine-save self-test diverged between runs"
            exit 1
          fi
          echo "$a"
          # Stage 5 B1 canonical-bytes baseline: the pinned length and
          # FNV-1a digest of the fixed demo scenario's save — identical
          # on every platform (the full pinned golden bytes live in
          # engine-core's save tests, which run in the Tests step).
          echo "$a" | grep -q "save-len=1209" || { echo "Stage 5 canonical save length changed"; exit 1; }
          echo "$a" | grep -q "save-fnv=c6c1b46c7d21843b" || { echo "Stage 5 canonical save digest changed"; exit 1; }
      - name: Stage 3 headless simulation smoke (deterministic, no GPU required)
        shell: bash
        run: |
          a=$(cargo run -q -p engine-slice -- --sim --ticks 300 --cadence 60)
          b=$(cargo run -q -p engine-slice -- --sim --ticks 300 --cadence 60)
          if [ "$a" != "$b" ]; then
            echo "headless simulation diverged between runs"
            exit 1
          fi
          echo "$a"
          # Stage 3 historical baseline compatibility: the pinned values.
          echo "$a" | grep -q "executed 45717" || { echo "Stage 3 baseline execution count changed"; exit 1; }
          echo "$a" | grep -q "engine-lanes=5591d3eb05643e78" || { echo "Stage 3 lane fingerprint changed"; exit 1; }
          echo "$a" | grep -q "state-lanes=9d90cb3bbd45b032" || { echo "Stage 3 state-lanes fingerprint changed"; exit 1; }
      - name: Stage 4 presence scenario determinism (double run per scenario)
        shell: bash
        run: |
          for scenario in stationary walk tour; do
            a=$(cargo run -q -p engine-slice -- --sim --presence $scenario)
            b=$(cargo run -q -p engine-slice -- --sim --presence $scenario)
            if [ "$a" != "$b" ]; then
              echo "presence scenario $scenario diverged between runs"
              exit 1
            fi
            echo "$scenario: $(echo "$a" | grep -o 'stage4=[0-9a-f]*')"
          done
      - name: Vulkan offscreen render smoke (Linux only — software rasterizer, correctness evidence, NOT performance evidence)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --frames 20 --fps 0
          # Corrective-pass verification: run with the Khronos validation
          # layer actually enabled and exercise the swapchain-recreation
          # path (--simulate-resize) — the demo exits nonzero when the
          # layer is active and reports errors.
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --frames 20 --fps 0 --validation on --simulate-resize
          # Stage 4: the regional render path (camera-as-presence, dynamic
          # region-scene buffers) under the ACTIVE validation layer, plus
          # the swapchain-recreation path with region geometry live — zero
          # application-generated validation errors required. Windows
          # runners expose no Vulkan loader; that platform's validation
          # coverage stays in these Linux gates (reported honestly, not
          # silently skipped).
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --regions --frames 20 --fps 0 --validation on
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --regions --frames 20 --fps 0 --validation on --simulate-resize
          # Stage 4 final-review finding A: force pipeline replacement on
          # recreation with region buffers initialized — the
          # surface-format-change lifecycle (region-scene buffer
          # carry-over) that same-format resizing cannot reach.
          SDL_VIDEODRIVER=offscreen cargo run -p engine-slice -- --render --regions --frames 20 --fps 0 --validation on --simulate-resize --replace-pipelines
      - name: Stage 6 integrated soak smoke (Linux only — lavapipe, correctness evidence, NOT performance evidence)
        if: runner.os == 'Linux'
        # The bounded S6-C3 smoke, never a 900-second CI job: the REAL
        # binary, offscreen, a ~40 s wall window over the compressed
        # fixture — the full protocol end to end (the measured window,
        # the cutoff, the bounded drain, the graceful close, the
        # verified evidence package, the workload gate) with validation
        # active, then the fresh-process recovery relaunch. Lavapipe is
        # a software rasterizer: correctness smoke only, never GPU
        # performance evidence.
        timeout-minutes: 10
        shell: bash
        run: |
          SOAK="$RUNNER_TEMP/s7-s6c3-smoke"
          EVI="$RUNNER_TEMP/s7-s6c3-smoke-evidence"
          rm -rf "$SOAK" "$EVI"
          # The external watchdog discipline (§6): a process-level
          # bound comfortably above the window + drain + close.
          SDL_VIDEODRIVER=offscreen timeout 300 cargo run -q -p engine-slice -- \
            --demo-persist "$SOAK" \
            --soak-wall-seconds 40 --scenario stage6-v1-short \
            --evidence-dir "$EVI" --validation on
          # The fresh-process recovery verification (the closed
          # campaign continues exactly — no input replay).
          cargo run -q -p engine-slice -- --demo-persist "$SOAK" --headless --ticks 30
          echo "S6-C3 integrated soak smoke: window + drain + close + evidence + recovery clean"

  # Mac 1 (macos-port authorization 2026-10-20, independent Mac 0 review
  # GO): additive macOS ARM64 job — CPU portability only (no GPU, no
  # Vulkan SDK, no MoltenVK; graphical acceptance is Mac 2 on the lead's
  # M1 rig). The ubuntu/windows matrix job above stays byte-identical to
  # the reviewed workflow; this job mirrors its CPU gates, additionally
  # pins the Stage 4 per-scenario fingerprints, and gates the runner
  # architecture explicitly (arm64 / aarch64-apple-darwin) instead of
  # trusting the macos-15 label. Bash steps avoid bash-4 constructs
  # (case, not associative arrays) because `shell: bash` on macOS
  # runners resolves to the system bash 3.2. GitHub's standard macos-15
  # runner is an M1 with ~7 GB RAM and limited disk; if parallel
  # compilation ever exceeds those resources, reduce build parallelism
  # here — never engine semantics, never continue-on-error.
  macos-arm64:
    name: macos-15 ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # (CI-C1) Rust dependency/build cache, the identical pinned
      # v2.9.3 configuration as the matrix job (engine -> target,
      # dependency crates only, save on success), after the pinned
      # toolchain install so the key derives from the active
      # rustc/cargo pair. The per-test-process SDL strategy and every
      # gate below are untouched — the cache only removes dependency
      # recompilation, never test execution.
      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "engine -> target"
      - name: Confirm ARM64 runner and Rust host
        shell: bash
        run: |
          uname -m
          rustc_vv=$(rustc -vV)
          echo "$rustc_vv"
          [ "$(uname -m)" = "arm64" ] || { echo "runner is not arm64"; exit 1; }
          # Pipe-free by design (run 39510072079, Mac 1 review): BSD grep -q
          # exits on the first match while a live producer's line-buffered
          # stdout may still be writing — SIGPIPE plus `pipefail` failed a
          # correctly-matching host. Input is captured first, then the line
          # is compared exactly, so partial matches are rejected as well.
          rustc_host=$(grep "^host:" <<< "$rustc_vv")
          [ "$rustc_host" = "host: aarch64-apple-darwin" ] || { echo "Rust host is not aarch64-apple-darwin (got: $rustc_host)"; exit 1; }
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      # SDL 3.4.18 on Apple platforms asserts that every video (re)init in
      # a process happens on the thread that first initialized SDL (vendored
      # SDL/src/SDL.c, #ifdef SDL_PLATFORM_APPLE; other platforms carry no
      # such assert, so the ubuntu/windows jobs keep the default
      # multi-threaded harness). The Rust libtest harness runs each test on
      # a fresh thread — even with --test-threads=1 (verified empirically)
      # — so a test binary whose tests repeatedly init SDL (engine-shell's
      # lifecycle contract) aborts by SDL's own assertion (run 39510757458,
      # signal 6). The real application is single-threaded per process and
      # unaffected. CI-level correction only — no engine or test changes:
      # every test still runs, with the three SDL-touching engine-shell
      # suites executed one test per process (--exact), restoring the
      # one-thread-per-process invariant SDL requires.
      - name: Tests (workspace, SDL-free suites)
        run: cargo test --workspace --exclude engine-shell --features engine-persist/composite-test-fixture,engine-slice/crash-test-seams
      # (V2X-CP3-B-P1 F3, extended to B-R1a2) The feature-disabled
      # production-path regression on macOS ARM64, identical to the
      # matrix job's step: the B-P1 and B-R1a2 production tests run
      # WITHOUT composite-test-fixture on every platform.
      - name: Feature-disabled production-path tests (B-P1, B-R1a2)
        run: |
          cargo test -p engine-persist --lib bp1_production_tests
          cargo test -p engine-persist --lib r1a2_production_tests
      - name: Tests (engine-shell, one test per process)
        shell: bash
        run: |
          for suite in input_dispatch lifecycle soak; do
            list=$(cargo test -q -p engine-shell --test "$suite" -- --list --format terse)
            while IFS= read -r line; do
              case "$line" in
                *": test") name=${line%": test"} ;;
                *) continue ;;
              esac
              echo "== $suite :: $name"
              cargo test -q -p engine-shell --test "$suite" -- --exact "$name"
            done <<< "$list"
          done
      - name: Fingerprint self-test double run (pinned Stage 0 values)
        shell: bash
        run: |
          a=$(cargo run -q -p engine-slice -- --fingerprint-selftest)
          b=$(cargo run -q -p engine-slice -- --fingerprint-selftest)
          if [ "$a" != "$b" ]; then
            echo "fingerprint self-test mismatch between runs"
            exit 1
          fi
          echo "$a"
          # Stage 0 historical baseline compatibility: the pinned values.
          # Herestring input is fully materialized before grep runs, so the
          # BSD grep -q early-exit/SIGPIPE hazard cannot occur (Mac 1
          # review guidance after run 39510072079).
          grep -Fq "engine=6504123a47cab66f" <<< "$a" || { echo "Stage 0 engine fingerprint changed"; exit 1; }
          grep -Fq "state=937bd3b6f56f07e0" <<< "$a" || { echo "Stage 0 state fingerprint changed"; exit 1; }
      - name: Stage 5 spine-save self-test (double run, pinned values)
        shell: bash
        run: |
          a=$(cargo run -q -p engine-slice -- --save-selftest)
          b=$(cargo run -q -p engine-slice -- --save-selftest)
          if [ "$a" != "$b" ]; then
            echo "spine-save self-test diverged between runs"
            exit 1
          fi
          echo "$a"
          # Stage 5 B1 canonical-bytes baseline (herestring form — the
          # BSD grep discipline noted in the fingerprint step above):
          # identical on every platform, including this ARM64 runner.
          grep -Fq "save-len=1209" <<< "$a" || { echo "Stage 5 canonical save length changed"; exit 1; }
          grep -Fq "save-fnv=c6c1b46c7d21843b" <<< "$a" || { echo "Stage 5 canonical save digest changed"; exit 1; }
      - name: Stage 3 headless simulation smoke (deterministic, no GPU required)
        shell: bash
        run: |
          a=$(cargo run -q -p engine-slice -- --sim --ticks 300 --cadence 60)
          b=$(cargo run -q -p engine-slice -- --sim --ticks 300 --cadence 60)
          if [ "$a" != "$b" ]; then
            echo "headless simulation diverged between runs"
            exit 1
          fi
          echo "$a"
          # Stage 3 historical baseline compatibility: the pinned values
          # (herestring form — see the fingerprint step note).
          grep -Fq "executed 45717" <<< "$a" || { echo "Stage 3 baseline execution count changed"; exit 1; }
          grep -Fq "engine-lanes=5591d3eb05643e78" <<< "$a" || { echo "Stage 3 lane fingerprint changed"; exit 1; }
          grep -Fq "state-lanes=9d90cb3bbd45b032" <<< "$a" || { echo "Stage 3 state-lanes fingerprint changed"; exit 1; }
      - name: Stage 4 presence scenarios (double run per scenario, pinned values)
        shell: bash
        run: |
          for scenario in stationary walk tour; do
            a=$(cargo run -q -p engine-slice -- --sim --presence $scenario)
            b=$(cargo run -q -p engine-slice -- --sim --presence $scenario)
            if [ "$a" != "$b" ]; then
              echo "presence scenario $scenario diverged between runs"
              exit 1
            fi
            echo "$scenario: $(grep -o 'stage4=[0-9a-f]*' <<< "$a")"
            case "$scenario" in
              stationary) pinned=da1b2d1a7e5cd49e ;;
              walk) pinned=1df391ad488848bf ;;
              tour) pinned=495ab27b37549e93 ;;
            esac
            grep -Fq "stage4=$pinned" <<< "$a" || { echo "Stage 4 $scenario fingerprint changed (expected stage4=$pinned)"; exit 1; }
          done

  # (CI-C2, the owner's 2026-11-11 GO — the package-level sharding's
  # second half) The COMPLETE engine-slice test battery, in parallel
  # with the main validation job. engine-slice is the measured
  # execution-mass leader (s6_soak, pp_b3_reclaim, pp_b3_rotation —
  # the crash-seam suites that re-execute their own test binaries as
  # child processes with env-var roles and process-id-keyed scratch
  # roots); a separate runner guarantees those binaries never share
  # a machine with simultaneously-running tests, preserving the
  # accepted sequential-harness semantics exactly. This job claims
  # NO feature-disabled artifact isolation (that gate lives in the
  # main job, after Build, before its feature-enabled Tests) and
  # runs no fmt/clippy/build/selftests — every one of those
  # acceptance checks remains exactly once, in the main job. The
  # feature string is the F1-verified form: crash-test-seams for the
  # selected package, with engine-persist/composite-test-fixture
  # arriving through engine-slice's own dev-dependency edge. Cache:
  # the accepted CI-C1 rust-cache step verbatim — a NEW job-scoped
  # cache key per OS (first execution cold, then warm restores); no
  # cross-job shared keys, no workspace-crate caching, the pinned
  # action unchanged.
  heavy-tests:
    name: heavy-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "engine -> target"
      # (CI-C2 §6) The workspace-membership guard: the sharding
      # partition is package-exact, so the package set itself is the
      # coverage contract. Exactly the five authorized members — a
      # NEW package REFUSES here by name (an explicit inventory
      # review, never a silent omission); new test targets inside
      # existing packages run automatically but shift the pinned
      # counts below (the documented maintenance obligation).
      - name: Workspace inventory guard (exactly the five authorized packages)
        shell: bash
        run: |
          # Package ids are "<path>#<version>" (the pinned toolchain's
          # cargo metadata format), so the member name is the final
          # path segment before the #version suffix.
          members=$(cargo metadata --no-deps --format-version 1 | grep -oE '"workspace_members":\[[^]]*\]' | grep -oE '[A-Za-z0-9_-]+#[0-9][0-9.]*' | sed 's/#.*//' | sort)
          count=$(printf '%s\n' "$members" | wc -l)
          echo "workspace members ($count): $(printf '%s\n' "$members" | tr '\n' ' ')"
          [ "$count" -eq 5 ] || { echo "WORKSPACE INVENTORY CHANGED: $count members, expected exactly 5 — the package sharding requires an explicit inventory review"; exit 1; }
          for pkg in engine-core engine-persist engine-renderer engine-shell engine-slice; do
            printf '%s\n' "$members" | grep -qx "$pkg" || { echo "MISSING EXPECTED PACKAGE: $pkg"; exit 1; }
          done
          echo "inventory guard: exactly the five authorized packages"
      # (CI-C2 F2) The heavy-shard battery and its exact-count gates.
      # Expected executed totals (established at the accepted CI-C1
      # baseline from real inventories — locally executed AND parsed
      # from run 42934990684): 442 Linux / 441 Windows passed, 3
      # ignored, 44 cargo test-result lines (the slice lib + bin +
      # the 42 integration binaries + the doc section) — UNCHANGED at
      # the integrated Stage 6 tree (engine-slice untouched by the
      # A/B lines; locally re-executed at the integrated tree).
      # RECOMPUTED at the C5c completion-crossing-recognition branch
      # (the new-main f3f03bb + the six platform-uniform
      # crossing::c5c_reader_tests): 448 Linux MEASURED with this
      # shard's own command (448 passed / 0 failed / 3 ignored / 44
      # result lines, the workflow's own awk); 447 Windows = the
      # prior 441 + the same six platform-uniform tests (no cfg
      # gates). UNCHANGED through C5d, B-R1a4, and the F-01 audit
      # hardening (engine-slice gained no tests — only the
      # benchmark mode; re-MEASURED at the audit worktree: 448
      # passed / 0 failed / 44 result lines). Together with
      # the main shard's 950 / 899 (the cycle-3 947 / 896 plus
      # the F-01 +3 engine-persist lib tests)
      # these sum to the F-01 battery (1398 / 1346; both
      # re-MEASURED at this tree before the commit). MAINTENANCE
      # OBLIGATION:
      # legitimate new tests require updating these pins in the same
      # change. A shard that unexpectedly executes no tests fails
      # here — compilation success is never counted as coverage.
      - name: Tests (heavy shard — the complete engine-slice battery)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p engine-slice --features engine-slice/crash-test-seams 2>&1 | tee tests-heavy.log
          expected=448
          if [ "$(uname -s)" != "Linux" ]; then expected=447; fi
          passed=$(awk '/test result: ok/ {for(i=1;i<NF;i++) if($(i+1)=="passed;") s+=$i} END {print s+0}' tests-heavy.log)
          ignored=$(awk '/test result: ok/ {for(i=1;i<NF;i++) if($(i+1)=="ignored;") s+=$i} END {print s+0}' tests-heavy.log)
          results=$(grep -c 'test result:' tests-heavy.log || true)
          echo "heavy shard: $passed passed, $ignored ignored, $results test-result lines (expected $expected / 3 / 44)"
          [ "$passed" -eq "$expected" ] || { echo "HEAVY SHARD COUNT MISMATCH: $passed != $expected"; exit 1; }
          [ "$ignored" -eq 3 ] || { echo "HEAVY SHARD IGNORED MISMATCH: $ignored != 3"; exit 1; }
          [ "$results" -eq 44 ] || { echo "HEAVY SHARD RESULT-LINE MISMATCH: $results != 44"; exit 1; }
